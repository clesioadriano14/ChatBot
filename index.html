<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Chat com IA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside class="menu">
        <button id="novaConversa" type="button">+ Nova conversa</button>
        <div id="lista" class="lista"></div>
    </aside>

    <section class="chat">
        <h1 id="titulo">Nova conversa</h1>

        <div class="chave">
            <label for="chave">Chave da API (Groq):</label>
            <input id="chave" type="password" placeholder="gsk_..." autocomplete="off">
            <a href="https://console.groq.com/keys" target="_blank" rel="noopener">Criar chave</a>
        </div>

        <div id="mensagens" class="mensagens"></div>

        <form id="formulario" class="formulario">
            <textarea id="entrada" rows="2" placeholder="Digite sua mensagem" required></textarea>
            <button id="enviar" type="submit">Enviar</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>

</html>
